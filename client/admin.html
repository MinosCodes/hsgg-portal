<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Adminbereich – Horst-Schlaemmer-Gedaechtnis-Gymnasium</title>
    <link href="grundgeruest/grundgeruest.css" rel="stylesheet"/>
    <link href="admin.css" rel="stylesheet"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <script src="api.js"></script>
</head>
<body>
<div id="page">
    <!-- Sidebar -->
    <aside id="sidebar" class="show">
        <nav id="sidebar-menu">
            <ul class="sidebar top">
                <li><a href="./homepage.html">Home</a></li>
            </ul>
        </nav>
    </aside>

    <!-- rechter Bereich -->
    <div id="content">
        <!-- Header inkl. Button-Overlay -->
        <header id="header-content">
            Adminbereich – Benutzerrechte
        </header>

        <!-- Inhalt -->
        <main id="main-content" class="content-wrapper">
            <section class="admin-section">
                <h1>Benutzerverwaltung</h1>
                <p>Rollen verwalten, neue Benutzer anlegen.</p>

                <div class="admin-filters">
                    <label for="role-filter">Rolle filtern:</label>
                    <select id="role-filter">
                        <option value="all">Alle</option>
                        <option value="ADMIN">Admin</option>
                        <option value="TEACHER">Lehrkraft</option>
                        <option value="STUDENT">Schüler/in</option>
                    </select>

                    <label for="user-search">Suche:</label>
                    <input type="text" id="user-search" placeholder="Name oder Benutzername">
                </div>

                <div class="admin-table-wrapper">
                    <table class="admin-table">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Benutzername</th>
                            <th>Aktuelle Rolle</th>
                            <th>Neue Rolle</th>
                            <th>Aktion</th>
                        </tr>
                        </thead>
                        <tbody id="admin-user-table-body">
                        </tbody>
                    </table>
                </div>

                <section class="admin-info">
                    <h2>Neuen Benutzer anlegen</h2>
                    <form id="create-user-form" class="admin-filters">
                        <input id="create-firstname" type="text" placeholder="Vorname" required>
                        <input id="create-lastname" type="text" placeholder="Nachname" required>
                        <input id="create-username" type="text" placeholder="Benutzername" required>
                        <input id="create-password" type="password" placeholder="Passwort" required>
                        <select id="create-role" required>
                            <option value="TEACHER">Lehrkraft</option>
                            <option value="STUDENT">Schüler/in</option>
                            <option value="ADMIN">Admin</option>
                        </select>
                        <button type="submit" class="btn-small">Anlegen</button>
                        <span id="create-user-message"></span>
                    </form>
                </section>
            </section>
        </main>
    </div>
    <div id="button-overlay">
    <button id="sidebar-toggle-button" aria-label="Navigation umschalten">
        <span></span>
        <span></span>
        <span></span>
    </button>
</div>
</div>

<script src="admin.js"></script>
</body>
</html>
