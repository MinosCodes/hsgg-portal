<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>HSGG - Lernmaterial</title>
    <link href="grundgeruest/grundgeruest.css" rel="stylesheet">
    <link href="content.css" rel="stylesheet">
</head>
<body>
<div id="page">
    <div id="sidebar" class="show">
        <nav id="sidebar-menu">
            <ul class="sidebar top">

                <li><a href="#">Jahr 5</a></li>

            </ul>
        </nav>
    </div>

    <div id="content">
        <header id="header-content">Horst-Schlaemmer-Gedaechtnis-Gymnasium</header>

        <main id="main-content">
            <ol id="content-list"></ol>
            <div id="content-container" class="invisible">
                <div>
                    <h3 id="datei-name"></h3>
                    <a id="download-link" href="" download="">Download</a>
                </div>
                <iframe id="file-viewer" src=""></iframe>
            </div>
        </main>

        <footer id="footer-content" class="border-separation">
            <ul>
                <li><a href="#">Adresse </a></li>
                <li><a href="tel:">Telefon</a></li>
                <li><a href="mailto:">Email</a></li>
            </ul>
        </footer>
    </div>
</div>

<!-- Hamburger button -->
<div id="button-overlay">
    <button id="sidebar-toggle-button">
        <span></span>
        <span></span>
        <span></span>
    </button>
</div>
<script>
    const contentList = document.querySelector('#content-list');
    const contentContainer = document.querySelector('#content-container');

    const listOfContent = [];
    // Only generate some example data for now - should at some point be requested from an API
    for (let i = 1; i <= 10; i++) {
        listOfContent.push({
            name: 'Beispiel ' + i,
            file: 'bspl' + i + '.pdf'
        });
    }

    const url = new URL(location.href);
    const currentFile = url.searchParams.get('file');

    // Add everything from listOfContent to the Web Page
    for (const fileData of listOfContent) {
        const elem = document.createElement('li');
        const link = document.createElement('a');
        link.innerText = fileData.name;
        url.searchParams.set('file', fileData.file);
        link.href = url.href;

        elem.append(link);
        contentList.append(elem);
    }

    // Show currently selected file
    if (currentFile) {
        const currentFileData = listOfContent.filter(v => v.file === currentFile)[0];
        document.querySelector('#datei-name').innerText = currentFileData.name;
        document.querySelector('#download-link').href = 'content/' + currentFileData.file;
        document.querySelector('#file-viewer').src = 'content/' + currentFileData.file;

        document.querySelector('#content-container').classList.remove('invisible');
    }

    const toggleButton = document.getElementById('sidebar-toggle-button');
    const sidebar = document.getElementById('sidebar');

    const setInitialSidebarState = () => {
        if (window.innerWidth <= 768) {
            sidebar.classList.add('hidden');
            toggleButton.classList.remove('active');
        } else {
            sidebar.classList.remove('hidden');
            toggleButton.classList.remove('active');
        }
    };

    setInitialSidebarState();
    window.addEventListener('resize', setInitialSidebarState);

    toggleButton.addEventListener('click', () => {
        toggleButton.classList.toggle('active');
        sidebar.classList.toggle('hidden');
    });
</script>
</body>
</html>
