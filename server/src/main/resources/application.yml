app:
  learning-materials-dir: data

spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/hsgg
    username: hsgguser
    password: secret

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.MariaDBDialect
      hibernate.format_sql: true
      show-sql: true
      open-in-view: false

  sql:
    init:
      mode: always

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
              sql:
                BasicBinder: TRACE