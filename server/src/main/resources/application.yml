app:
  learning-materials-dir: data

spring:
  datasource:
    url: jdbc:mariadb://localhost:3307/hsgg
    username: hsgguser
    password: secret

  web:
    resources:
      static-locations: file:../client/

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.MariaDBDialect
      hibernate.format_sql: true
      show-sql: true
      open-in-view: false

  sql:
    init:
      mode: always

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE

jwt:
  secret: "my-super-secure-64-char-secret-key-for-hsgg-project-123456789123"