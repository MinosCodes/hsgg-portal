services:
  mariadb:
    image: mariadb:11
    container_name: hsgg-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: hsgg
      MYSQL_USER: hsgguser
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci

volumes:
  mariadb_data:
