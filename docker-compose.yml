services:
  mariadb:
    image: mariadb:11
    container_name: hsgg-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: hsgg
      MYSQL_USER: hsgguser
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci

  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: hsgg
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/hsgg
      SPRING_DATASOURCE_USERNAME: hsgguser
      SPRING_DATASOURCE_PASSWORD: secret
    volumes:
      - file_uploads:/data
    depends_on:
      - mariadb

volumes:
  mariadb_data:
  file_uploads:
